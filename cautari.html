<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><title>Radar</title><link rel="manifest" href="manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Radar"><link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#0b0b0a;--p:#141412;--p2:#1e1d1a;--b:#2a2924;--t:#eeece4;--m:#8f8c80;--a:#d4ff3f;--a2:#d4ff3f;--g:#d4ff3f;--ok:#4ade80;--ink:#0b0b0a;--lime-d:#9fbf2a}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;overflow:hidden;font-size:14px}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 500px at 85% -10%,rgba(212,255,63,.22),transparent 60%),radial-gradient(700px 400px at 0% 110%,rgba(212,255,63,.14),transparent 60%);pointer-events:none}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
aside{width:232px;flex:none;padding:22px 14px;border-right:1px solid var(--b);background:rgba(10,11,18,.7);backdrop-filter:blur(20px);display:flex;flex-direction:column;gap:4px;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 10px 22px}.logo i{width:34px;height:34px;border-radius:10px;background:var(--g);display:grid;place-items:center;font-style:normal;box-shadow:0 6px 20px rgba(212,255,63,.45)}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:500;transition:.15s}.nav:hover{background:var(--p);color:var(--t)}.nav.on{background:var(--p2);color:var(--t);box-shadow:inset 2px 0 0 var(--a)}
.nav .ni{font-style:normal}.nav .c{margin-left:auto;font-size:11px;background:var(--p2);padding:2px 8px;border-radius:20px}
main{flex:1;display:flex;flex-direction:column;min-width:0;z-index:1}
header{display:flex;align-items:center;gap:14px;padding:16px 28px;border-bottom:1px solid var(--b)}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:9px 14px}.search input{flex:1;background:none;border:0;outline:0;color:var(--t);font:inherit}
#view{flex:1;overflow:auto;padding:26px 28px 60px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--p2);border:1px solid var(--b);font-weight:600;font-size:13px;transition:.15s;white-space:nowrap}.btn:hover{background:rgba(255,255,255,.14)}.btn.pri{background:var(--g);border:0;box-shadow:0 6px 18px rgba(212,255,63,.35)}

.ad{display:grid;grid-template-columns:1fr auto;gap:10px;padding:18px;background:var(--p);border:1px solid var(--b);border-radius:16px;margin-bottom:12px;transition:.15s}.ad:hover{border-color:rgba(212,255,63,.45)}
.adh{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.adv{font-weight:700;font-size:16px}
.hook{margin:12px 0 8px;font-size:15px;padding-left:12px;border-left:3px solid var(--a2);color:#eeece4}
.meta{display:flex;gap:16px;color:var(--m);font-size:12.5px;flex-wrap:wrap}.meta b{color:var(--t)}
.acts{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.flags{display:inline-flex;gap:4px;flex-wrap:wrap}.cc{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(212,255,63,.18);color:#d4ff3f;letter-spacing:.04em}

.vi{padding:10px 12px;font-size:12px}.vi b{display:block;font-size:13px}.vi span{color:var(--m);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.back{color:var(--m);margin-bottom:16px;display:inline-block}.back:hover{color:var(--t)}
.tabs{display:flex;gap:4px;background:var(--p);border:1px solid var(--b);padding:4px;border-radius:12px;width:max-content;margin-bottom:18px}.tab{padding:8px 16px;border-radius:9px;color:var(--m);font-weight:600}.tab.on{background:var(--p2);color:var(--t)}
.stats{display:flex;gap:12px;margin-top:18px}.st{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:12px 16px;min-width:100px}.st b{font-size:22px;display:block;background:var(--g);-webkit-background-clip:text;color:transparent}.st span{color:var(--m);font-size:12px}
.empty{padding:50px;text-align:center;color:var(--m);border:1px dashed var(--b);border-radius:16px}.empty div{font-size:34px;margin-bottom:8px}
.notes{max-width:720px}.msg{background:var(--p);border:1px solid var(--b);border-radius:14px 14px 14px 4px;padding:10px 14px;margin-bottom:10px}.msg small{color:var(--m);display:block;margin-bottom:3px;font-size:11px}
.nin{display:flex;gap:8px;margin-top:12px}.nin textarea,.f input,.f textarea{flex:1;background:var(--p);border:1px solid var(--b);border-radius:12px;color:var(--t);padding:10px 12px;font:inherit;resize:vertical;outline:0;width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);display:none;place-items:center;z-index:9}.modal.on{display:grid}
.mbox{background:#0f1018;border:1px solid var(--b);border-radius:18px;padding:18px;max-width:92vw;max-height:92vh;display:flex;gap:18px}

.f{display:grid;gap:10px;width:380px}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:10px}
.kb{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px;align-items:start}.kcol{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:12px;min-height:200px}.kcol h4{margin:0 0 12px;display:flex;justify-content:space-between;font-size:13px;letter-spacing:.04em;text-transform:uppercase;opacity:.85}.pcard{cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;margin-bottom:12px;transition:transform .15s}.pcard:hover{transform:translateY(-2px);border-color:rgba(167,139,250,.5)}.pth{aspect-ratio:9/16;max-height:300px;width:100%;background:#111 center/cover;display:flex;align-items:center;justify-content:center;font-size:34px}.pcb{padding:10px;display:flex;flex-direction:column;gap:7px;font-size:12px}.pl{display:flex;gap:5px;flex-wrap:wrap}.plb{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(212,255,63,.18);color:#f9a8d4}.plb.tt{background:rgba(34,211,238,.15);color:#67e8f9}.pmf textarea,.pmf select{width:100%;background:rgba(255,255,255,.05);color:inherit;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px;font:inherit;box-sizing:border-box}

.ptabs{display:flex;gap:6px;margin-bottom:16px}.ptab{padding:9px 18px;border-radius:12px;background:var(--p);border:1px solid var(--b);font-weight:600;color:var(--m);transition:.2s}.ptab:hover{color:var(--t)}
.ptab.on{color:#fff;border-color:transparent}.ptab.all.on{background:var(--p2);border-color:var(--b)}.ptab.ig.on{background:linear-gradient(45deg,#f9ce34,#ee2a7b 50%,#6228d7);box-shadow:0 6px 22px rgba(238,42,123,.35)}.ptab.tt.on{background:#000;border-color:#25f4ee;box-shadow:-3px 0 0 #25f4ee,3px 0 0 #fe2c55,0 6px 22px rgba(254,44,85,.25)}
.accs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}.acc{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:40px;background:var(--p);border:1px solid var(--b);transition:.2s;position:relative}.acc:hover{border-color:rgba(255,255,255,.25);transform:translateY(-1px)}.acc.on{background:var(--p2);border-color:var(--a);box-shadow:0 0 0 3px rgba(212,255,63,.18)}
.acc b{font-size:13px;display:block;text-align:left}.acc small{color:var(--m);font-size:11px;display:block;text-align:left}.acc .ed{opacity:0;margin-left:4px;font-size:12px;padding:3px 6px;border-radius:8px;background:var(--p2)}.acc:hover .ed{opacity:1}
.av{border-radius:50%;padding:2px;flex:none;display:grid}.av.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.av.tt{background:conic-gradient(#25f4ee,#fe2c55,#25f4ee)}.av>span{border-radius:50%;background:#0b0c12 center/cover;display:grid;place-items:center;font-weight:800;border:2px solid #0b0c12;color:#fff}
.addacc{padding:10px 16px;border-radius:40px;border:1px dashed rgba(255,255,255,.22);color:var(--m);font-weight:600;transition:.2s}.addacc:hover{color:var(--t);border-color:var(--a);background:rgba(212,255,63,.08)}
.prof{display:flex;align-items:center;gap:22px;padding:22px;border-radius:20px;background:var(--p);border:1px solid var(--b);margin-bottom:18px;animation:fu .35s ease}.prof h2{font-size:21px;display:flex;align-items:center;gap:10px}.pfb{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff}.pfb.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}.pfb.tt{background:#000;border:1px solid #25f4ee;box-shadow:2px 0 0 #fe2c55}
.cnt{display:flex;gap:26px;margin-top:10px}.cnt div b{font-size:19px;display:block}.cnt div span{color:var(--m);font-size:12px}
.tool{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}.fch{display:flex;gap:6px;flex-wrap:wrap}.fc{padding:6px 13px;border-radius:20px;background:var(--p);border:1px solid var(--b);font-size:12.5px;font-weight:600;color:var(--m);transition:.15s}.fc.on{color:var(--t);background:var(--p2);border-color:var(--a)}.fc i{font-style:normal;opacity:.6;margin-left:4px}
.vtg{display:flex;background:var(--p);border:1px solid var(--b);padding:3px;border-radius:10px}.vtg button{padding:6px 14px;border-radius:8px;color:var(--m);font-weight:600;font-size:12.5px}.vtg button.on{background:var(--p2);color:var(--t)}
.pg{display:grid;gap:3px;border-radius:14px;overflow:hidden;animation:fu .35s ease}.pg.ig{grid-template-columns:repeat(3,1fr);max-width:820px}.pg.tt{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.gi{position:relative;background:#14151d center/cover;cursor:pointer;overflow:hidden;animation:fu .4s ease both}.pg.ig .gi{aspect-ratio:4/5}.pg.tt .gi{aspect-ratio:9/16;border-radius:6px}.gi:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.75));transition:.2s}.gi:hover:after{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.8))}.gi .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:.4}
.gi .s{position:absolute;top:8px;left:8px;z-index:1;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;backdrop-filter:blur(8px)}.s.sa{background:rgba(251,191,36,.85);color:#1a1200}.s.sp{background:rgba(59,130,246,.85)}.s.so{background:rgba(34,197,94,.85);color:#03200d}.s.sr{background:rgba(239,68,68,.85)}
.gi .t{position:absolute;left:10px;right:10px;bottom:9px;z-index:1;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gi .rl{position:absolute;top:8px;right:9px;z-index:1;font-size:13px}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.modal.on .mbox{animation:pop .22s ease}
.phone{width:290px;flex:none;border-radius:38px;border:10px solid #1c1d26;background:#000;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 1px #333;display:flex;flex-direction:column;height:600px;position:relative}
.phone .notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:90px;height:22px;border-radius:20px;background:#000;z-index:3}
.ph-ig{display:flex;flex-direction:column;height:100%;background:#000;padding-top:32px;font-size:12.5px}.ph-ig .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:700}.ph-ig .md{aspect-ratio:4/5;background:#111;display:grid;place-items:center;overflow:hidden}.ph-ig .md video,.ph-ig .md img{width:100%;height:100%;object-fit:cover}.ph-ig .ic{padding:8px 10px;font-size:18px;letter-spacing:8px}.ph-ig .cp{padding:0 10px;overflow:auto;line-height:1.4}.ph-ig .cp .hs{color:#e0f1ff}
.ph-tt{position:relative;height:100%;background:#111}.ph-tt video,.ph-tt img{width:100%;height:100%;object-fit:cover}.ph-tt .ov{position:absolute;left:12px;right:56px;bottom:18px;font-size:12.5px;line-height:1.4;text-shadow:0 1px 3px #000}.ph-tt .ov b{font-size:14px}.ph-tt .side{position:absolute;right:8px;bottom:70px;display:flex;flex-direction:column;gap:16px;font-size:22px;align-items:center}.ph-tt .side small{font-size:10px;display:block;text-align:center}
.pmf{width:340px;display:flex;flex-direction:column;gap:11px;overflow:auto;max-height:600px;padding-right:4px}.pmf label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--m);font-weight:600}.pmf select,.pmf input,.pmf textarea,.f select{background:var(--p);border:1px solid var(--b);border-radius:10px;color:var(--t);padding:9px 11px;font:inherit;outline:0}.pmf select option,.f select option{background:#0f1018}
.pacc{display:flex;gap:6px;flex-wrap:wrap}.pacc button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:20px;border:1px solid var(--b);font-size:12px;font-weight:600;opacity:.55}.pacc button.on{opacity:1;border-color:var(--a);background:var(--p2)}
.sw{display:flex;gap:8px}.sw button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--a)}
.plsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plsel button{padding:12px;border-radius:12px;border:1px solid var(--b);background:var(--p);font-weight:700}.plsel button.on.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);border-color:transparent}.plsel button.on.tt{background:#000;border-color:#25f4ee;box-shadow:3px 0 0 #fe2c55}
.kp{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:16px 0}.kc{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px 16px}.kc span{color:var(--m);font-size:12px;font-weight:600}.kc b{display:block;font-size:24px;margin:6px 0 2px;letter-spacing:-.5px}.kc small{font-size:12px;color:var(--m)}.up{color:#22c55e!important}.dn{color:#ef4444!important}
.sc{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px}.sc h3{font-size:15px;margin-bottom:12px}.s2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}@media(max-width:1000px){.s2{grid-template-columns:1fr}}
.tv{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--b)}.tv:first-of-type{border:0}.tv .r{width:26px;height:26px;border-radius:8px;background:var(--g);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}.tv .x{flex:1;min-width:0}.tv .x a{font-weight:600}.tv .x div{color:var(--m);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tv b{font-size:15px}
.ins li{list-style:none;padding:9px 0;border-top:1px solid var(--b);line-height:1.5}.ins li:first-child{border:0}.ins{padding:0}.ins b{color:#d4ff3f}
.vs table{width:100%;border-collapse:collapse;font-size:13px}.vs td,.vs th{padding:7px 8px;border-top:1px solid var(--b);text-align:left}.vs th{color:var(--m);font-weight:600;font-size:12px}.vs select{background:#11121a;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:4px 6px;font:inherit;font-size:12px}
.cmp td:nth-child(n+2){text-align:right}.bar svg rect.b{transition:.15s}.bar svg rect.b:hover{opacity:.75}
/* ===== De postat ===== */
.dp-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
.dp-k div{background:var(--p);border:1px solid var(--b);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}

.dp-list{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}

.dp-p:hover{transform:translateY(-2px);border-color:rgba(212,255,63,.5)}

.dp-ring:before{content:"";position:absolute;inset:5px;border-radius:50%;background:#0d0e15 center/cover;background-image:var(--im,none)}
.dp-ring b{position:relative;font-size:13px;font-weight:800;text-shadow:0 1px 4px #000}
.dp-p h3{font-size:15px;margin-bottom:6px;line-height:1.25}
.dp-tags{display:flex;gap:6px;flex-wrap:wrap}.dp-t{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--p2);color:#cfd2e3;white-space:nowrap}
.dp-t.ok{background:rgba(34,197,94,.16);color:#86efac}.dp-t.wa{background:rgba(251,191,36,.14);color:#fcd34d}

 const all=D.postari.filter(match);const mine=a?all.filter(x=>postAcc(x).includes(a.id)):[];const cnt=s=>mine.filter(x=>stOf(x)===s).length;

 ${((tx,ds)=>tx||ds?`<div class="dp-idei">${tx?`<div class="dp-ix dp-ix--ecran"><small>💬 Idee text pe ecran <em>doar idee, nu e pe video</em></small><div class="dp-ecran"><span class="txt">${esc(tx)}</span></div><div class="dp-ib">${txList(c).length>1?`<button onclick="dpAlt(this,'${esc(c.id)}')">↻ Altă idee</button>`:''}<button onclick="dpCopy(this)">Copiază</button></div></div>`:''}${ds?`<div class="dp-ix dp-ix--desc"><small>📝 Descriere</small><span class="txt">${esc(ds)}</span><div class="dp-ib"><button onclick="dpCopy(this)">Copiază</button></div></div>`:''}</div>`:'')(txOf(c),c.descriere||capOf(c,clipNr(c)))}
 <div class="dp-row">${src?((dl=>`<a class="btn dp-dl ${dl?'done':''}" href="${esc(src)}" download onclick="dpDl(this,'${esc(c.id)}')">${dl?`✓ Descărcat <small>${dl.slice(8,10)}.${dl.slice(5,7)}</small>`:'⬇ Descarcă'}</a>`)((st.depost[c.id]||{}).descarcat)):''}<button class="dp-tg ${s.postat?'on':''}" onclick="dpToggle('${esc(c.id)}')"><i>${s.postat?'✓':''}</i>Postat</button></div>
 <div class="dp-acc">${A.map(a=>`<button class="${s.postatPe.includes(a.id)?'on':''}" onclick="dpAcc('${esc(c.id)}','${esc(a.id)}')">${avatar(a,22)}@${esc(a.handle)} <em style="font-style:normal;opacity:.6;font-size:10px">${pk(a).toUpperCase()}</em></button>`).join('')||'<small>Adaugă conturile în Postări.</small>'}</div>
 <label class="dp-date">Data<input type="date" value="${esc(s.dataPostare)}" onchange="dpSet('${esc(c.id)}',{dataPostare:this.value})"></label></div></div>`}
function renderDP(v,id){const all=PP();
 if(id){const p=all.find(x=>x.id===id);if(!p){v.innerHTML=empty('❓','Produs inexistent');return}
  const n=dpCount(p),cl=clipsOf(p).filter(c=>{const s=clipSt(c);return DPF==='toate'||(DPF==='postate'?s.postat:!s.postat)});
  v.innerHTML=`<a class="back" href="#/depostat">← Toate produsele</a><div class="dp-bar"><h1>${esc(p.nume)}</h1><button class="btn" onclick="dpExport()">📋 Copiază bifele pentru bot</button></div><p class="sub" style="margin-bottom:10px">${n.gata} clipuri gata · ${n.trimise} ${n.trimise===1?'trimis':'trimise'} · ${n.postate} ${n.postate===1?'postat':'postate'}</p><div class="dp-prog"><i style="width:${n.gata?Math.round(n.postate/n.gata*100):0}%"></i></div>
  ${(p.surse||[]).length?`<div class="dp-src">${p.surse.map(s=>`<a ${s.url?`href="${esc(s.url)}" target="_blank" rel="noopener"`:''}>${s.platforma?`<em>${esc(/tik/i.test(s.platforma)?'TT':/insta/i.test(s.platforma)?'IG':/meta|face/i.test(s.platforma)?'META':s.platforma)}</em>`:''}${esc(s.cont||s.url||'sursă')}</a>`).join('')}</div>`:''}
  <div class="dp-f">${[['toate','Toate',n.gata],['depostat','De postat',n.gata-n.postate],['postate','Postate',n.postate]].map(([k,t,c])=>`<button class="${DPF===k?'on':''}" onclick="DPF='${k}';render()">${t} · ${c}</button>`).join('')}</div>
  ${cl.length?`<div class="dp-g">${cl.map(dpClip).join('')}</div>`:empty('🎬',DPF==='postate'?'Niciun clip postat încă':'Niciun clip aici')}`;return}
 const ps=all.filter(p=>!Q||JSON.stringify(p).toLowerCase().includes(Q));const T=all.map(dpCount).reduce((a,b)=>({gata:a.gata+b.gata,trimise:a.trimise+b.trimise,postate:a.postate+b.postate}),{gata:0,trimise:0,postate:0});
 v.innerHTML=`<h1>De postat</h1><p class="sub">Produsele cu clipuri gata. Bifele „Postat” se salvează pe acest dispozitiv.</p>
 <div class="dp-k"><div><b>${all.length}</b><span>produse</span></div><div><b>${T.gata}</b><span>clipuri gata</span></div><div><b>${T.trimise}</b><span>trimise</span></div><div><b>${T.postate}</b><span>postate</span></div></div>
 ${ps.length?`<div class="dp-list">${ps.map(dpCard).join('')}</div>`:empty('🚀','Niciun produs de postat')}`}
/* ===== Structura v3: Produse (conturi + clipuri) și Competitori (reclame, organic, magazine) ===== */
const ALLP=()=>{const m=new Map();D.produse.forEach(p=>m.set(p.id,Object.assign({},p)));PP().forEach(p=>m.set(p.id,Object.assign({},m.get(p.id)||{},p)));return[...m.values()]};
const accsOf=pid=>ACC().filter(a=>a.produsId===pid);
const ORG=()=>arr('competitoriOrganic').filter(x=>x&&x.id);
const compOf=pid=>({reclame:D.reclame.filter(r=>!pid||r.produsId===pid),organic:ORG().filter(o=>!pid||o.produsId===pid),magazine:D.competitori.filter(c=>!pid||c.produsId===pid)});
const compN=pid=>{const c=compOf(pid);return c.reclame.length+c.organic.length+c.magazine.length};
const profUrl=a=>a.url||(pk(a)==='tt'?'https://www.tiktok.com/@'+a.handle:'https://www.instagram.com/'+a.handle+'/');
let PT='clipuri',CT='reclame',CP='';
function prodCard(p,i){const n=dpCount(p),A=accsOf(p.id),pct=n.gata?Math.round(n.postate/n.gata*100):0,c=compN(p.id);
 return `<a class="p3" style="animation-delay:${Math.min(i,12)*30}ms" href="#/produs/${encodeURIComponent(p.id)}"><div class="p3-img" ${p.imagine?`style="background-image:url('${esc(p.imagine)}')"`:''}>${p.imagine?'':'<span>📦</span>'}${n.gata?`<b class="p3-n">${n.gata} clipuri</b>`:''}</div>
 <div class="p3-b"><h3>${esc(p.nume)}</h3><div class="p3-acc">${A.length?A.map(a=>avatar(a,22)).join(''):'<small>Fără conturi încă</small>'}</div>
 <div class="dp-prog" style="margin:4px 0 2px"><i style="width:${pct}%"></i></div><div class="p3-m"><span><b>${n.postate}</b>/${n.gata} postate</span><span>🥊 <b>${c}</b> competitori</span></div></div></a>`}
function accRow(p){const A=accsOf(p.id);
 return `<div class="p3-accs">${A.map(a=>`<a class="acc" target="_blank" rel="noopener" href="${esc(profUrl(a))}">${avatar(a,30)}<span><b>@${esc(a.handle)}</b><small>${pk(a)==='tt'?'TikTok':'Instagram'}</small></span><button class="ed" onclick="event.preventDefault();event.stopPropagation();accModal('${esc(a.id)}')">✎</button></a>`).join('')}<button class="addacc" onclick="accModal(null,'${esc(p.id)}')">＋ Cont Instagram / TikTok</button></div>`}
function clipsBlock(p){const n=dpCount(p),cl=clipsOf(p).filter(c=>{const s=clipSt(c);return DPF==='toate'||(DPF==='postate'?s.postat:!s.postat)});
 if(!n.gata)return empty('🎬','Încă nu sunt clipuri gata pentru produsul ăsta');
 return `<div class="dp-bar"><div class="dp-f" style="margin:0">${[['toate','Toate',n.gata],['depostat','De postat',n.gata-n.postate],['postate','Postate',n.postate]].map(([k,t,c])=>`<button class="${DPF===k?'on':''}" onclick="DPF='${k}';render()">${t} · ${c}</button>`).join('')}</div><button class="btn" onclick="dpExport()">📋 Copiază bifele pentru bot</button></div><div style="height:14px"></div>
 ${cl.length?`<div class="dp-g">${cl.map(dpClip).join('')}</div>`:empty('🎬',DPF==='postate'?'Niciun clip postat încă':'Niciun clip aici')}`}
function orgCard(o,showProd=true){const tops=Array.isArray(o.topVideo)?o.topVideo:[];
 return `<div class="ad"><div><div class="adh">${showProd?chip(o.produsId):''}<span class="adv">@${esc(o.handle||o.nume||'')}</span><span class="bd">${esc(/tik/i.test(o.platforma||'')?'TikTok':/insta/i.test(o.platforma||'')?'Instagram':(o.platforma||''))}</span>${o.urmaritori!=null?`<span class="bd"><b>${fmtK(o.urmaritori)}</b> urmăritori</span>`:''}${o.tara?flag(o.tara):''}</div>
 ${o.nota?`<div class="hook">${esc(o.nota)}</div>`:''}<div class="meta">${o.postariPeSaptamana!=null?`<span>📅 <b>${o.postariPeSaptamana}</b> postări/săpt.</span>`:''}${o.vizualizariMedii!=null?`<span>👁 <b>${fmtK(o.vizualizariMedii)}</b> vizualizări medii</span>`:''}${o.vindeProdus?`<span>🛒 vinde produsul</span>`:''}${o.actualizat?`<span>actualizat ${esc(o.actualizat)}</span>`:''}</div>
 ${tops.length?`<div class="org-top">${tops.slice(0,4).map(t=>`<a target="_blank" rel="noopener" href="${esc(t.url)}"><b>${t.vizualizari!=null?fmtK(t.vizualizari):'▶'}</b>${esc((t.descriere||'').slice(0,60))}</a>`).join('')}</div>`:''}</div>
 <div class="acts">${o.url?`<a class="btn pri" target="_blank" rel="noopener" href="${esc(o.url)}">Profil ↗</a>`:''}${o.linkMagazin?`<a class="btn" target="_blank" rel="noopener" href="${esc(o.linkMagazin)}">Magazin ↗</a>`:''}</div></div>`}
function compBlock(pid,showProd){const C=compOf(pid),q=x=>match(x);const L={reclame:C.reclame.filter(q),organic:C.organic.filter(q),magazine:C.magazine.filter(q)};
 const tabs=[['reclame','📣 Reclame active',L.reclame.length],['organic','🌱 Organic',L.organic.length],['magazine','🏪 Magazine',L.magazine.length]];
 return `<div class="tabs">${tabs.map(([k,t,c])=>`<button class="tab ${CT===k?'on':''}" onclick="CT='${k}';render()">${t} <span style="opacity:.6">${c}</span></button>`).join('')}</div>
 ${CT==='reclame'?(L.reclame.length?L.reclame.sort((a,b)=>(days(b.dataStart)||0)-(days(a.dataStart)||0)).map(r=>adRow(r,showProd)).join(''):empty('📣','Nicio reclamă activă găsită')):CT==='organic'?(L.organic.length?L.organic.sort((a,b)=>(b.urmaritori||0)-(a.urmaritori||0)).map(o=>orgCard(o,showProd)).join(''):empty('🌱','Niciun cont organic adăugat încă')):compTable(L.magazine,showProd)}`}
function renderProd(v,id){const p=ALLP().find(x=>x.id===id);if(!p){v.innerHTML=empty('❓','Produs inexistent');return}
 const n=dpCount(p),c=compN(p.id);
 v.innerHTML=`<a class="back" href="#/produse">← Toate produsele</a><div class="hero p3-hero"><div class="pimg" ${img(p)}>${p.imagine?'':'<div class="ph">📦</div>'}</div><div>${p.brand?`<span class="bd">${esc(p.brand)}</span>`:''}<h1 style="margin-top:10px">${esc(p.nume)}</h1>${p.pret!=null?`<div class="price" style="font-size:22px">${money(p.pret,p.moneda)}${p.pretVechi?`<s>${money(p.pretVechi,p.moneda)}</s>`:''}</div>`:''}${p.descriere?`<p class="sub" style="margin-top:10px">${esc(p.descriere)}</p>`:''}
 <div class="p3-lbl">Conturile produsului</div>${accRow(p)}
 <div class="stats"><div class="st"><b>${n.gata}</b><span>clipuri gata</span></div><div class="st"><b>${n.trimise}</b><span>${n.trimise===1?'trimis':'trimise'}</span></div><div class="st"><b>${n.postate}</b><span>${n.postate===1?'postat':'postate'}</span></div><div class="st"><b>${c}</b><span>competitori</span></div></div>${p.url?`<a class="btn" style="margin-top:14px" target="_blank" rel="noopener" href="${esc(p.url)}">Vezi pe site ↗</a>`:''}</div></div>
 <div class="ptabs">${[['clipuri','🎬 Clipuri'],['competitori','🥊 Competitori'],['surse','📡 Surse']].map(([k,t])=>`<button class="ptab ${PT===k?'on all':''}" onclick="PT='${k}';render()">${t}</button>`).join('')}</div>
 ${PT==='clipuri'?clipsBlock(p):PT==='competitori'?compBlock(p.id,false):((p.surse||[]).length?`<div class="dp-src">${p.surse.map(s=>`<a ${s.url?`href="${esc(s.url)}" target="_blank" rel="noopener"`:''}><em>${esc(/tik/i.test(s.platforma||'')?'TT':/insta/i.test(s.platforma||'')?'IG':'META')}</em>${esc(s.cont||s.url||'sursă')}</a>`).join('')}</div>`:empty('📡','Nicio sursă încă'))}`}
function renderProduse(v){const ps=ALLP().filter(p=>!Q||JSON.stringify(p).toLowerCase().includes(Q));const T=ps.map(dpCount).reduce((a,b)=>({gata:a.gata+b.gata,trimise:a.trimise+b.trimise,postate:a.postate+b.postate}),{gata:0,trimise:0,postate:0});
 v.innerHTML=`<h1>Produse</h1><p class="sub">Intră pe un produs: clipurile lui, conturile lui de Instagram și TikTok, competitorii.</p>
 <div class="dp-k"><div><b>${ps.length}</b><span>produse</span></div><div><b>${T.gata}</b><span>clipuri gata</span></div><div><b>${T.trimise}</b><span>trimise</span></div><div><b>${T.postate}</b><span>postate</span></div></div>
 ${ps.length?`<div class="p3-grid">${ps.map(prodCard).join('')}</div>`:empty('📦','Niciun produs')}`}
function renderComp(v){const ps=ALLP();const pid=ps.some(p=>p.id===CP)?CP:'';
 v.innerHTML=`<h1>Competitori</h1><p class="sub">Separat de produsele noastre: cine rulează reclame, cine crește organic și ce magazine vând același lucru.</p>
 <div class="dp-f"><button class="${!pid?'on':''}" onclick="CP='';render()">Toate produsele</button>${ps.filter(p=>compN(p.id)).map(p=>`<button class="${pid===p.id?'on':''}" onclick="CP='${esc(p.id)}';render()">${esc(p.nume)} · ${compN(p.id)}</button>`).join('')}</div>
 ${compBlock(pid,!pid)}`}
function render(){const h=(location.hash||'#/produse').slice(2).split('/');const v=document.getElementById('view');let k=h[0];
 const by=(k,pid)=>D[k].filter(x=>(!pid||x.produsId===pid)&&match(x));
 if(k==='depostat'){location.replace(h[1]?'#/produs/'+h[1]:'#/produse');return}
 if(k==='produs'){nav('produse');renderProd(v,decodeURIComponent(h[1]||''));return}
 if(k==='produs'){const p=prod(decodeURIComponent(h[1]||''));nav('produse');if(!p){v.innerHTML=empty('❓','Produs inexistent');return}
  const L={reclame:by('reclame',p.id),competitori:by('competitori',p.id),video:by('video',p.id)};
  v.innerHTML=`<a class="back" href="#/produse">← Toate produsele</a><div class="hero"><div class="pimg" ${img(p)}>${p.imagine?'':'<div class="ph">👕</div>'}</div><div><span class="bd">${esc(p.brand)}</span><h1 style="margin-top:10px">${esc(p.nume)}</h1><div class="price" style="font-size:24px">${money(p.pret,p.moneda)}${p.pretVechi?`<s>${money(p.pretVechi,p.moneda)}</s>`:''}</div><p class="sub" style="margin-top:10px">${esc(p.descriere)}</p>${p.url?`<a class="btn pri" target="_blank" href="${esc(p.url)}">Vezi pe site ↗</a>`:''}<div class="stats"><div class="st"><b>${L.reclame.length}</b><span>reclame</span></div><div class="st"><b>${L.competitori.length}</b><span>competitori</span></div><div class="st"><b>${L.video.length}</b><span>video-uri</span></div></div></div></div>
  <div class="tabs">${[['reclame','📣 Reclame'],['competitori','🥊 Competitori'],['video','🎬 Video-uri'],['note','📝 Note']].map(([t,n])=>`<button class="tab ${tab===t?'on':''}" onclick="tab='${t}';render()">${n}</button>`).join('')}</div>
  <div>${tab==='reclame'?(L.reclame.length?L.reclame.map(r=>adRow(r,false)).join(''):empty('📣','Nicio reclamă')):tab==='competitori'?compTable(L.competitori,false):tab==='video'?videoGrid(L.video):notesBox(p.id)}</div>`;return}
 if(!navs.find(n=>n[0]===k))k='produse';nav(k);
 if(k==='produse'){renderProduse(v);return}
 if(k==='produse_vechi'){const ps=D.produse.filter(p=>!Q||JSON.stringify(p).toLowerCase().includes(Q));v.innerHTML=`<h1>Produse</h1><p class="sub">Apasă pe un produs ca să vezi reclamele, competitorii și video-urile lui.</p>${ps.length?`<div class="grid">${ps.map(productCard).join('')}</div>`:empty('📦','Niciun produs')}`}
 if(k==='reclame'){const l=by('reclame').sort((a,b)=>(days(b.dataStart)||0)-(days(a.dataStart)||0));v.innerHTML=`<h1>Reclame</h1><p class="sub">${l.length} reclame active · sortate după câte zile rulează</p>${l.length?l.map(r=>adRow(r)).join(''):empty('📣','Nicio reclamă')}`}
 if(k==='competitori'){renderComp(v);return}
 if(k==='competitori_vechi'){v.innerHTML=`<h1>Competitori</h1><p class="sub">Cine mai vinde produse asemănătoare în Europa</p>${compTable(by('competitori'))}`}
 if(k==='video'){const l=by('video').sort((a,b)=>(b.likeuri||0)-(a.likeuri||0));v.innerHTML=`<h1>Video-uri</h1><p class="sub">${l.length} video-uri salvate · apasă ca să rulezi</p>${videoGrid(l)}`}
 if(k==='postari'){renderPost(v)}
 if(k==='statistici'){renderStats(v)}
 if(k==='note'){v.innerHTML=`<h1>Note</h1><p class="sub">Toate notițele tale</p>${notesBox('')}`}
 const nt=document.getElementById('nt');if(nt)nt.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.nextElementSibling.click()}}}
let to;document.getElementById('q').oninput=e=>{clearTimeout(to);to=setTimeout(()=>{Q=e.target.value.trim().toLowerCase();render()},150)};
addEventListener('hashchange',()=>{tab='reclame';PT='clipuri';DPF='toate';render();document.getElementById('view').scrollTop=0});
addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
render();
</script></body></html>
